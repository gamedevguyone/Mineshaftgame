<style>
html,body{overscroll-behavior:none;-webkit-touch-callout:none;margin:0;height:100%;overflow:hidden;background:#000;font-family:monospace;color:#fff;touch-action:none;user-select:none}
#gl{position:fixed;left:0;top:0;display:block;z-index:0}
#menu{position:fixed;inset:0;background:#222c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30}
#menu input{padding:10px;font-size:18px;text-align:center}
button{padding:8px 12px;font-size:16px;cursor:pointer}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:8px;width:2px;height:18px}#cross:after{top:8px;height:2px;width:18px}
#bar{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:3px}
#bar div{width:42px;height:42px;border:3px solid #555;box-sizing:border-box;background:#0006}
#bar div.on{border-color:#fff}
#bar canvas,#pal canvas{width:100%;height:100%;image-rendering:pixelated}
#net{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;background:#0009;padding:6px;font-size:13px}
#joy{position:fixed;width:100px;height:100px;margin:-50px 0 0 -50px;border:2px solid #fff6;border-radius:50%;display:none;pointer-events:none}
#knob{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#fff6}
#who,#hp,#msg{position:fixed;left:max(8px,env(safe-area-inset-left));background:#0009;padding:6px;font-size:13px}
#who{top:8px}#hp{top:44px;font-size:16px}#msg{top:80px;display:none}
#hurt{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;transition:opacity .3s}
#pal{position:fixed;inset:8% 10%;background:#000c;z-index:20;display:none;flex-wrap:wrap;gap:6px;padding:12px;align-content:flex-start;overflow:auto}
#pal div{width:44px;height:44px;border:2px solid #666;cursor:pointer}
#tb{display:none;position:fixed;right:10px;bottom:70px;flex-direction:column;gap:8px}
.touch #tb{display:flex}#tb button{width:60px;height:60px;border-radius:50%;opacity:.7}
